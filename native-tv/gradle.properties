# Required: project uses AndroidX (androidx.core / appcompat)
android.useAndroidX=true
# No legacy support-library deps in this project, so Jetifier is unnecessary
android.enableJetifier=false
# Give the Kotlin/Java compiler enough heap (MainActivity.kt is ~9.8k lines)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true